<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><rect width="720" height="420" rx="28" fill="#0e131a"/><g font-family="Arial"><text x="42" y="52" fill="#f4f6f8" font-size="23" font-weight="700">Explicit criteria beat vague intent</text><rect x="56" y="114" width="255" height="200" rx="22" fill="#26231d" stroke="#6b583c"/><text x="183" y="151" text-anchor="middle" fill="#f1d18c" font-size="16" font-weight="700">Vague</text><text x="183" y="195" text-anchor="middle" fill="#baa782" font-size="13">“Be conservative.”</text><text x="183" y="224" text-anchor="middle" fill="#978a73" font-size="11">What counts?</text><text x="183" y="246" text-anchor="middle" fill="#978a73" font-size="11">What should be skipped?</text><rect x="408" y="114" width="255" height="200" rx="22" fill="#18261f" stroke="#3c6a50"/><text x="535" y="151" text-anchor="middle" fill="#afe2c3" font-size="16" font-weight="700">Explicit</text><text x="535" y="191" text-anchor="middle" fill="#9ccbad" font-size="11">Report bugs + security issues</text><text x="535" y="217" text-anchor="middle" fill="#9ccbad" font-size="11">Skip local style preferences</text><text x="535" y="243" text-anchor="middle" fill="#9ccbad" font-size="11">Show ambiguous examples</text><text x="360" y="365" text-anchor="middle" fill="#8793a2" font-size="12">When judgment is inconsistent, demonstrate the decision boundary.</text></g></svg>
